# SupoClip application host on Dokploy (reynandaptr.dev). Read deploy/dokploy/README.md first.
#
# Runs the web app, API, AI worker, scheduler, PostgreSQL and Redis. There is no video worker
# here: rendering, transcription and downloads run on a separate machine
# (deploy/wsl-worker/compose.yml, docs/render-worker.md), so media lives in the S3 bucket
# (Cloudflare R2) and the inline-encoding clip edits are switched off.
#
# PostgreSQL and Redis publish on 127.0.0.1 only (15432/16379); the host exposes them to the
# tailnet with `tailscale serve --tcp`. Never publish them on 0.0.0.0.
#
# Images are built by CircleCI (.circleci/config.yml). pull_policy: always makes every Dokploy
# deploy run the newest `latest`.

x-backend-env: &backend-env
  PYTHONPATH: "/app"
  PYTHONUNBUFFERED: "1"
  PUBLIC_API_URL: "http://backend:8000"
  WEBHOOK_ALLOW_PRIVATE_TARGETS: "true"
  POSTHOG_PROJECT_TOKEN: "${POSTHOG_PROJECT_TOKEN:-}"
  POSTHOG_HOST: "${POSTHOG_HOST:-https://eu.i.posthog.com}"
  DATABASE_URL: "postgresql+asyncpg://supoclip:${POSTGRES_PASSWORD:?required}@postgres:5432/supoclip"
  TEMP_DIR: "/app/uploads"
  MEDIA_STORAGE: "s3"
