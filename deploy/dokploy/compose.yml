  DISCORD_SALES_WEBHOOK_URL: "${DISCORD_SALES_WEBHOOK_URL:-}"
  STRIPE_CANCELLATION_WEBHOOK_SECRETS: "${STRIPE_CANCELLATION_WEBHOOK_SECRETS:-}"

x-backend: &backend
  image: ghcr.io/reynandaptr/supoclip-backend:${SUPOCLIP_TAG:-latest}
  pull_policy: always
  restart: unless-stopped
  networks:
    - supoclip-network
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  backend:
    <<: *backend
    command: [".venv/bin/uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *backend-env
      SUPOCLIP_SERVICE: "api"
    volumes:
      # Direct /upload bodies land here before the copy to the bucket; user fonts are kept here too.
      - uploads:/app/uploads
      - user_fonts:/app/fonts/users
    networks:
      - supoclip-network
      - dokploy-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/db"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  ai-worker:
    <<: *backend
    command: [".venv/bin/arq", "src.workers.ai_worker.AIWorkerSettings"]
    environment:
      <<: *backend-env
      SUPOCLIP_SERVICE: "ai-worker"
    healthcheck:
      test: ["CMD", ".venv/bin/arq", "--check", "src.workers.ai_worker.AIWorkerSettings"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # The scheduler (supoclip_cron). It must run on this host: it copies uploads that landed on
  # the API's disk to the bucket (docs/render-worker.md).
  cron-worker:
    <<: *backend
    command: [".venv/bin/arq", "src.workers.cron_worker.CronWorkerSettings"]
    environment:
      <<: *backend-env
      SUPOCLIP_SERVICE: "cron-worker"
    volumes:
      - uploads:/app/uploads
      - user_fonts:/app/fonts/users
    healthcheck:
      test: ["CMD", ".venv/bin/arq", "--check", "src.workers.cron_worker.CronWorkerSettings"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    image: ghcr.io/reynandaptr/supoclip-frontend:${SUPOCLIP_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      NODE_ENV: "production"
      NEXT_TELEMETRY_DISABLED: "1"
      BACKEND_INTERNAL_URL: "http://backend:8000"
      DATABASE_URL: "postgresql://supoclip:${POSTGRES_PASSWORD:?required}@postgres:5432/supoclip"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?required}"
      BETTER_AUTH_URL: "${NEXT_PUBLIC_APP_URL:-https://supoclip.reynandaptr.dev}"
      BETTER_AUTH_TRUSTED_ORIGINS: "${NEXT_PUBLIC_APP_URL:-https://supoclip.reynandaptr.dev}"
      BACKEND_AUTH_SECRET: "${BACKEND_AUTH_SECRET:?required}"
      APP_SETTINGS_ENCRYPTION_KEY: "${APP_SETTINGS_ENCRYPTION_KEY:?required}"
      DISABLE_SIGN_UP: "${DISABLE_SIGN_UP:-true}"
      NEXT_PUBLIC_LANDING_ONLY_MODE: "false"
    networks:
      - supoclip-network
      - dokploy-network
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      # Exercises Better Auth and Prisma, not only the static landing page.
      test: ["CMD", "curl", "-f", "http://localhost:3107/api/auth/get-session"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "supoclip"
      POSTGRES_USER: "supoclip"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?required}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      # Tailnet only, via `tailscale serve --tcp 15432 tcp://127.0.0.1:15432` (README).
      - "127.0.0.1:15432:5432"
    networks:
      - supoclip-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supoclip -d supoclip"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?required}"
    command:
      [
        "sh",
        "-c",
        "exec docker-entrypoint.sh redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\"",
      ]
    volumes:
      - redis_data:/data
    ports:
      # Tailnet only, via `tailscale serve --tcp 16379 tcp://127.0.0.1:16379` (README).
      - "127.0.0.1:16379:6379"
    networks:
      - supoclip-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  uploads:
  user_fonts:
  postgres_data:
  redis_data:

networks:
  # clipper-uploader joins this network as external (http://backend:8000, and SupoClip's webhook
  # reaches http://clipper-uploader:8080).
  supoclip-network:
    name: supoclip-network
  dokploy-network:
    external: true
